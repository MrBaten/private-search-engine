# Full stack: Nginx -> custom engine (/) and SearXNG (/searxng/).
# Privacy: every service uses the "none" logging driver, so Docker never
# writes container output to disk. Nothing persists: valkey runs without
# snapshots/AOF and the custom engine's filesystem is read-only.
#
# Public URL: set SEARXNG_BASE_URL in a root .env file (see .env.example) or
# the shell, e.g. SEARXNG_BASE_URL=https://search.example.org/searxng/
services:
  custom-engine:
    build: ./custom-engine
    expose:
      - "5000"
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Logging driver "none": no container logs are stored (queries must never
    # reach disk, even by accident).
    logging:
      driver: "none"
    networks:
      - private-net

  searxng:
    image: searxng/searxng:latest
    env_file:
      - ./searxng/.env
    environment:
      # Overrides searxng/.env (whose default suits the standalone stack on
      # :8080). Here SearXNG is served under /searxng/ by nginx.
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost/searxng/}
      # Config files are mounted read-only; don't let the entrypoint chown them.
      - FORCE_OWNERSHIP=false
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    depends_on:
      - valkey
    expose:
      - "8080"
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"
    networks:
      - private-net

  valkey:
    image: valkey/valkey:8-alpine
    # Memory only: no RDB snapshots, no append-only file.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"
    networks:
      - private-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # Uses the HEALTHCHECK baked into custom-engine/Dockerfile (/healthz).
      # SearXNG is resolved per request by nginx, so it is not a hard dependency.
      custom-engine:
        condition: service_healthy
    restart: always
    # No access log is configured and the error log is critical-only; the
    # "none" driver additionally keeps whatever nginx prints off the disk.
    logging:
      driver: "none"
    networks:
      - private-net

networks:
  private-net:
    driver: bridge
