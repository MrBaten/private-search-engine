# Nginx front door for PrivateSearch.
#   /           -> custom engine (Flask/gunicorn, custom-engine:5000)
#   /searxng/   -> SearXNG (searxng:8080) served under a sub-path
#
# Security headers: add_header directives are inherited from the enclosing
# level ONLY if the current level defines none of its own. To keep that rule
# simple, the headers are set once at server level and NO location block
# defines add_header. Upstream copies of the same headers are hidden with
# proxy_hide_header so each header is sent exactly once.

worker_processes auto;

# Critical errors only, to stderr (never to a file on disk). "crit" rather
# than "warn"/"error" because lower levels log rate-limit rejections and
# upstream errors together with the client IP and request line. Queries are
# POST bodies, so they never appear here either way. The nginx container also
# uses Docker's "none" logging driver; to debug, temporarily set "warn" here
# and remove that driver in docker-compose.yml.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Privacy: no access log at all. It would record client IPs and URLs.
    access_log off;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30;

    # Search requests are tiny form posts; reject anything bigger.
    client_max_body_size 16k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # Rate limiting: the zone holds hashed-size binary client IPs in shared
    # memory only (10 MB ~ 160k addresses). Nothing is logged or written to disk.
    limit_req_zone $binary_remote_addr zone=search_zone:10m rate=10r/s;
    limit_req_status 429;

    upstream custom_engine {
        server custom-engine:5000;
        keepalive 8;
    }

    # SearXNG is resolved at request time via Docker's embedded DNS (see the
    # /searxng/ location) instead of a static upstream: a static upstream is
    # resolved at startup, so a SearXNG container that is down or restarting
    # would stop nginx from starting and take the custom engine down with it.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security headers (sent on every response, including errors: "always").
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "interest-cohort=()" always;
        # Enable only once TLS is configured (see the HTTPS template below);
        # sending HSTS over plain HTTP is ignored by browsers.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # No Content-Security-Policy here on purpose: the Flask app sets its
        # own, and a global one would break SearXNG's pages.

        # --- Custom engine -------------------------------------------------
        location / {
            proxy_pass http://custom_engine;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Permissions-Policy;
            proxy_read_timeout 30s;
        }

        # Search endpoint: rate limited per client IP.
        location = /search {
            limit_req zone=search_zone burst=20 nodelay;

            proxy_pass http://custom_engine;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Permissions-Policy;
            proxy_read_timeout 30s;
        }

        # --- SearXNG under /searxng/ ---------------------------------------
        # Per the SearXNG nginx docs: keep the prefix in the proxied URI and
        # tell SearXNG its public prefix via X-Script-Name. X-Real-IP and
        # X-Forwarded-For feed its bot-detection trusted-proxy logic.
        location = /searxng {
            return 301 /searxng/;
        }

        location /searxng/ {
            # Variable => resolved per request; with no URI part the original
            # request URI (including the /searxng/ prefix) is passed through.
            set $searxng_backend http://searxng:8080;
            proxy_pass $searxng_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Script-Name /searxng;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Permissions-Policy;
            proxy_read_timeout 30s;
        }
    }

    # ---------------------------------------------------------------------
    # HTTPS template (Let's Encrypt). Uncomment, replace example.org, mount
    # /etc/letsencrypt into the nginx container, publish "443:443" in
    # docker-compose.yml, and enable the HSTS header above.
    # ---------------------------------------------------------------------
    # server {
    #     listen 80;
    #     server_name example.org;
    #     location /.well-known/acme-challenge/ { root /var/www/certbot; }
    #     location / { return 301 https://$host$request_uri; }
    # }
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name example.org;
    #
    #     ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_session_tickets off;
    #
    #     # Repeat the add_header block and the location blocks from the
    #     # port 80 server above here (X-Forwarded-Proto will be "https").
    # }
}
